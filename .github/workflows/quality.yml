name: Qualidade

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run security:secrets
      - run: npm run security:audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: node scripts/check-runtime.mjs
